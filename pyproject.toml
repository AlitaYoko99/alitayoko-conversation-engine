[project]
name = "alitayoko-conversation-engine"
version = "0.9.8"
description = "Self-hosted AI backend for AlitaYoko Conversations"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]